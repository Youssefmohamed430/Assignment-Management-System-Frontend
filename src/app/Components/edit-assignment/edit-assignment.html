<div class="form-shell">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0">Edit Assignment</h1>
    <a
      [routerLink]="['/Courses/AssignmentDetails', courseId]"
      class="btn btn-outline-light btn-sm"
    >
      Back
    </a>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <form #EditForm="ngForm" (submit)="EditAssignment(); $event.preventDefault()" class="surface-card p-4">
    <div class="mb-3">
      <label for="assignmentName" class="form-label">Assignment Title</label>
      <input
        type="text"
        id="assignmentName"
        class="form-control"
        placeholder="Assignment title"
        name="title"
        [(ngModel)]="assignment.title"
        required
      />
    </div>

    <div class="mb-4">
      <label for="assignmentDeadline" class="form-label">Deadline</label>
      <input
        type="datetime-local"
        id="assignmentDeadline"
        class="form-control"
        name="deadline"
        [(ngModel)]="assignment.deadLine"
        required
      />
    </div>

    <div class="mb-4">
      <label for="assignmentStatus" class="form-label">Status</label>
      <select id="assignmentStatus" class="form-select" name="status" [(ngModel)]="assignment.status">
        <option [ngValue]="0">Draft</option><option [ngValue]="1">Published</option><option [ngValue]="2">Closed</option><option [ngValue]="3">Archived</option>
      </select>
    </div>

    <p class="text-muted-custom small mb-4">
      Note: assignment file cannot be replaced after creation.
    </p>

    <button type="submit" class="btn btn-accent" [disabled]="EditForm.invalid">
      Save Changes
    </button>
  </form>
</div>
