<div class="container py-4">

  <!-- Search -->
  <form
    class="d-flex mb-4"
    (submit)="searchStudents()">

    <input
      class="form-control me-2"
      type="search"
      name="searchText"
      [(ngModel)]="searchText"
      (input)="onSearchInput()"
      placeholder="Search for a student..."
      aria-label="Search">

    <button
      class="btn btn-outline-success"
      type="submit">
      Search
    </button>

  </form>


  <!-- Students -->
  <div class="list-group">

    @for (student of studentList; track student.id) {

      <div
        class="list-group-item d-flex justify-content-between align-items-center p-3">

        <!-- Student Information -->
        <div>
          <h5 class="mb-1">
            {{ student.name }}
          </h5>

          <small class="text-muted">
            {{ student.email }}
          </small>
        </div>

        <!-- View Button -->
        <button
          type="button"
          class="btn btn-primary"
          routerLink = "/ViewStudent/{{student.id}}">
          View
        </button>

      </div>

    }

    @empty {
      <div class="alert alert-warning text-center">
        No students found.
      </div>
    }

  </div>

</div>
