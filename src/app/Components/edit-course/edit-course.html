<form #EditForm="ngForm" (submit)="EditCourse()">
  <fieldset >
    <legend>Edit Course</legend>
    <div class="mb-3">
      <label for="courseName" class="form-label">Course Name</label>
      <input type="text" id="courseName" class="form-control" placeholder="Course name" 
      value="{{ course?.crsName }}" [(ngModel)]="course.crsName" name="crsname">
    </div>
    <!-- <div class="mb-3">
      <label for="courseDescription" class="form-label">Course Description</label>
       <input> Image 
    </div> -->
    <div class="mb-3">
      <label for="courseInstructor" class="form-label">Instructor</label>
      <select id="courseInstructor" class="form-select" [(ngModel)]="course.instId" name="crsinst">
        @for (inst of InstructorList; track inst.id) {
          <option value="{{ inst.id }}" >
            {{ inst.name }}
          </option>
        }
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </fieldset>
</form>
