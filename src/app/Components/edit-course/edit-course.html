<form>
  <fieldset >
    <legend>Edit Course</legend>
    <div class="mb-3">
      <label for="courseName" class="form-label">Course Name</label>
      <input type="text" id="courseName" class="form-control" placeholder="Course name" value="{{ course?.name }}">
    </div>
    <div class="mb-3">
      <label for="courseDescription" class="form-label">Course Description</label>
        <textarea class="form-control" id="courseDescription" rows="3" placeholder="Course description">{{ course?.description }}</textarea>
    </div>
    <div class="mb-3">
      <label for="courseCategory" class="form-label">Category</label>
      <select id="courseCategory" class="form-select">
        @for (category of CategoryList; track category.id) {
          <option value="{{ category.id }}" >
            {{ category.categoryName }}
          </option>
        }
      </select>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </fieldset>
</form>
