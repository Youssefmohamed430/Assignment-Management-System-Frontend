<div class="form-shell">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0">Edit Course</h1>
    <a routerLink="/Courses" class="btn btn-outline-light btn-sm">Back</a>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }
  @if (successMessage) {
    <div class="alert alert-success">{{ successMessage }}</div>
  }

  <form #EditForm="ngForm" (submit)="EditCourse(); $event.preventDefault()" class="surface-card p-4">
    <div class="mb-3">
      <label for="courseName" class="form-label">Course Name</label>
      <input
        type="text"
        id="courseName"
        class="form-control"
        placeholder="Course name"
        [(ngModel)]="course.crsName"
        name="crsname"
        required
      />
    </div>

    <div class="mb-4">
      <label for="courseInstructor" class="form-label">Instructor</label>
      <select
        id="courseInstructor"
        class="form-select"
        [(ngModel)]="course.instId"
        name="crsinst"
        required
      >
        @for (inst of InstructorList; track inst.id) {
          <option [value]="inst.id">{{ inst.name }}</option>
        }
      </select>
    </div>

    <button type="submit" class="btn btn-accent" [disabled]="EditForm.invalid">
      Save Changes
    </button>
  </form>
</div>
