<section class="auth-page">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-75">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card">
          <h1 class="auth-title">Sign in</h1>
          <p class="auth-subtitle">Access your Assignment Manager account</p>

          @if (errorMessage) {
            <div class="alert alert-danger">{{ errorMessage }}</div>
          }

          <form (submit)="Login(); $event.preventDefault()" #LoginForm="ngForm">
            <div class="mb-3">
              <label class="form-label" for="loginUsername">Username</label>
              <input
                type="text"
                id="loginUsername"
                class="form-control form-control-lg"
                required
                name="username"
                placeholder="Enter username"
                [(ngModel)]="User.username"
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="loginPassword">Password</label>
              <input
                type="password"
                id="loginPassword"
                class="form-control form-control-lg"
                placeholder="Enter password"
                name="password"
                [(ngModel)]="User.password"
                required
              />
            </div>

            <button
              type="submit"
              class="btn btn-accent btn-lg w-100"
              [disabled]="LoginForm.invalid"
            >
              Login
            </button>

            <p class="auth-footer-text mt-3 mb-0">
              Don't have an account?
              <a routerLink="/Register">Register as Instructor</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
