<section class="auth-page">
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-75">
      <div class="col-md-6 col-lg-5">
        <div class="auth-card">
          <h1 class="auth-title">Register</h1>
          <p class="auth-subtitle">Create an instructor account</p>

          @if (errorMessage) {
            <div class="alert alert-danger">{{ errorMessage }}</div>
          }

          <form #RegisterForm="ngForm" (submit)="RegisterUser(); $event.preventDefault()">
            <div class="mb-3">
              <label class="form-label" for="regUsername">Username</label>
              <input
                type="text"
                id="regUsername"
                class="form-control form-control-lg"
                name="username"
                placeholder="Letters and numbers only"
                [(ngModel)]="registeredUser.userName"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="regName">Name</label>
              <input
                type="text"
                id="regName"
                class="form-control form-control-lg"
                name="name"
                placeholder="Letters only"
                [(ngModel)]="registeredUser.name"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="regEmail">Email</label>
              <input
                type="email"
                id="regEmail"
                class="form-control form-control-lg"
                name="email"
                placeholder="Enter email"
                [(ngModel)]="registeredUser.email"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="regPassword">Password</label>
              <input
                type="password"
                id="regPassword"
                class="form-control form-control-lg"
                name="password"
                placeholder="Min 8 chars, upper, lower, digit"
                [(ngModel)]="registeredUser.password"
                required
              />
            </div>

            <button
              type="submit"
              class="btn btn-accent btn-lg w-100"
              [disabled]="RegisterForm.invalid"
            >
              Register
            </button>

            <p class="auth-footer-text mt-3 mb-0">
              Already have an account?
              <a routerLink="/Login">Login</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
