<h1>Courses</h1>
<br>
<div class="container py-4">
  
  <!-- Add Course -->
  <div class="d-flex justify-content-end mb-4">
    @if(authservice.isAdmin())
    {
      <button class="btn btn-primary">
        
        <a routerLink = "/Courses/AddCourse" class="text-white text-decoration-none">
          Add Course
        </a>
      </button>
    }

    @if(authservice.isStudent())
    {
      <button class="btn btn-primary">
        <a routerLink = "/Courses/EnrollCourse" class="text-white text-decoration-none">
          Enroll Courses 
        </a>
      </button>
    }
  </div>
  <router-outlet> </router-outlet>
  <br>

  <!-- Courses -->
  <div class="row g-4">

    @for (course of CoursesList; track course.id) {

      <div class="col-lg-4 col-md-6 col-12">
        <div class="card h-100 shadow-sm">

          <img
            src="https://media.istockphoto.com/id/1413055686/vector/red-fake-stamp.jpg?s=1024x1024&w=is&k=20&c=uwsM8vxO5-8ZDg3ZksHRPCQbcHc6yFzQLWXAmKeJxzE="
            class="card-img-top"
            alt="Course Image"
          >

          <div class="card-body d-flex flex-column">

            <h5 class="card-title mb-3">
              {{ course.CrsName }}
            </h5>

            <p class="card-text mb-4">
              {{ course.InstName }}
            </p>

            <!-- Actions -->
            <div class="d-flex gap-2 mt-auto">

              <button class="btn btn-success">
                <a routerLink = "/Courses/AssignmentDetails/{{ course.id }}" class="text-white text-decoration-none">
                  Assignments
                </a>
              </button>
              @if(authservice.isAdmin())
              {

                <button class="btn btn-secondary">
                  <a routerLink = "/Courses/EditCourse/{{ course.id }}" class="text-white text-decoration-none">
                    Edit
                  </a>
                </button>
                
                <button class="btn btn-danger">
                  <a (click)="DeleteCourse(course.id)" class="text-white text-decoration-none">
                    Delete
                  </a>
                </button>
              }
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
