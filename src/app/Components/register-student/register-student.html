<div class="form-shell">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0">Register Student</h1>
    <a routerLink="/Courses" class="btn btn-outline-light btn-sm">Back</a>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }
  @if (successMessage) {
    <div class="alert alert-success">{{ successMessage }}</div>
  }

  <form #RegForm="ngForm" (submit)="submit(); $event.preventDefault()" class="surface-card p-4">
    <div class="mb-3">
      <label class="form-label" for="stuUsername">Username</label>
      <input
        id="stuUsername"
        class="form-control"
        name="username"
        [(ngModel)]="registeredUser.userName"
        required
      />
    </div>
    <div class="mb-3">
      <label class="form-label" for="stuName">Name</label>
      <input
        id="stuName"
        class="form-control"
        name="name"
        [(ngModel)]="registeredUser.name"
        required
      />
    </div>
    <div class="mb-3">
      <label class="form-label" for="stuEmail">Email</label>
      <input
        id="stuEmail"
        type="email"
        class="form-control"
        name="email"
        [(ngModel)]="registeredUser.email"
        required
      />
    </div>
    <div class="mb-4">
      <label class="form-label" for="stuPassword">Password</label>
      <input
        id="stuPassword"
        type="password"
        class="form-control"
        name="password"
        [(ngModel)]="registeredUser.password"
        required
      />
    </div>
    <button type="submit" class="btn btn-accent" [disabled]="RegForm.invalid">
      Register Student
    </button>
  </form>
</div>
