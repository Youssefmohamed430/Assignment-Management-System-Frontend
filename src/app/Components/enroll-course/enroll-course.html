<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
  <div>
    <h1 class="page-title mb-1">Available Courses</h1>
    <p class="page-subtitle mb-0">Enroll in a course to access assignments</p>
  </div>
  <a routerLink="/Courses" class="btn btn-outline-light btn-sm">My Courses</a>
</div>

@if (errorMessage) {
  <div class="alert alert-danger">{{ errorMessage }}</div>
}
@if (successMessage) {
  <div class="alert alert-success">{{ successMessage }}</div>
}

<div class="row g-4">
  @for (course of CoursesList; track course.id) {
    <div class="col-lg-4 col-md-6 col-12">
      <div class="surface-card h-100 fade-in">
        <div class="course-image-wrap">
          <img
            [src]="imageUrls[course.id] || 'assets/course-placeholder.svg'"
            class="course-image"
            alt="{{ course.crsName }}"
          />
        </div>
        <div class="surface-card-body d-flex flex-column">
          <h5 class="mb-2">{{ course.crsName }}</h5>
          <p class="text-muted-custom mb-4">{{ course.instName }}</p>
          <button
            type="button"
            class="btn btn-accent mt-auto"
            (click)="EnrollInCourse(course.id, course.crsName)"
          >
            Enroll
          </button>
        </div>
      </div>
    </div>
  } @empty {
    <div class="col-12">
      <div class="empty-state">No courses available.</div>
    </div>
  }
</div>
