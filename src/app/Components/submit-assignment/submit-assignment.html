<form>
  <fieldset >
    <legend>Add Assignment</legend>
    <div class="mb-3">
      <label for="assignmentDescription" class="form-label">Assignment Title</label>
      <input type="text" id="assignmentDescription" class="form-control" placeholder="Assignment title">
    </div>
    <div class="mb-3">
      <label for="assignmentName" class="form-label">Assignment File</label>
      <input type="file" id="assignmentName" class="form-control" placeholder="Assignment file">
    </div>
    
    <button type="submit" class="btn btn-primary">Submit</button>
  </fieldset>
</form>
