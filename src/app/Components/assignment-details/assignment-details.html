<div class="container py-4">

  <!-- Add Assignment -->
  <div class="d-flex justify-content-end mb-4">
    <button class="btn btn-primary">
        <a routerLink = "/AddAssignment/{{ CourseId }}" class="text-white text-decoration-none">
            Add Assignment
        </a>
    </button>
  </div>

  <!-- Assignments -->
  <div class="row g-4">

    @for (assignment of AssignmentList; track assignment.id) {

      <div class="col-lg-4 col-md-6 col-12">

        <div class="card h-100 shadow-sm">

          <div class="card-body d-flex flex-column">

            <h5 class="card-title">
              {{ assignment.title }}
            </h5>

            <h6 class="card-subtitle mb-3 text-muted">
              Deadline: {{ assignment.deadline | date }}
            </h6>

            <p class="card-text mb-4">
              Some quick example text to build on the card title
              and make up the bulk of the card's content.
            </p>

            <!-- Buttons -->
            <div class="d-flex gap-2 mt-auto">

              <a
                [routerLink]="['/ViewAssignment', assignment.id]"
                class="btn btn-primary flex-fill"
              >
                View
              </a>

              <a
                [routerLink]="['/EditAssignment', assignment.id]"
                class="btn btn-success flex-fill"
              >
                Edit
              </a>

              <button
                type="button"
                class="btn btn-danger flex-fill"
                (click)="DeleteAssignment(assignment.id)"
              >
                Delete
              </button>

            </div>

          </div>

        </div>

      </div>

    }

  </div>

</div>
