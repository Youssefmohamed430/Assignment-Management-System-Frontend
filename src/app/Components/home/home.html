<section class="home-hero">
  <div class="home-hero-overlay"></div>
  <div class="container home-hero-content">
    <p class="brand-mark">Assignment Manager</p>
    <h1 class="hero-headline">Organize courses, deadlines, and submissions in one place.</h1>
    <p class="hero-support">
      A focused workspace for admins, instructors, and students.
    </p>
    <div class="hero-actions">
      @if (authservice.getUserLogged()) {
        <a routerLink="/Courses" class="btn btn-accent btn-lg">Go to Courses</a>
      } @else {
        <a routerLink="/Login" class="btn btn-accent btn-lg">Get Started</a>
        <a routerLink="/Register" class="btn btn-outline-light btn-lg">Register</a>
      }
    </div>
  </div>
</section>
