<form>
  <fieldset >
    <legend>Add Assignment</legend>
    <div class="mb-3">
      <label for="assignmentName" class="form-label">Assignment Title</label>
      <input type="text" id="assignmentName" class="form-control" placeholder="Assignment title">
    </div>
    <div class="mb-3">
      <label for="assignmentDescription" class="form-label">Assignment Deadline</label>
      <input type="date" id="assignmentDescription" class="form-control" placeholder="Assignment date">
    </div>
    
    <button type="submit" class="btn btn-primary">Submit</button>
  </fieldset>
</form>
