<div class="form-shell">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="page-title mb-0">Add Assignment</h1>
    <a
      [routerLink]="['/Courses/AssignmentDetails', courseId]"
      class="btn btn-outline-light btn-sm"
    >
      Back
    </a>
  </div>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  <form (submit)="AddAssignment(); $event.preventDefault()" class="surface-card p-4">
    <div class="mb-3">
      <label for="assignmentName" class="form-label">Assignment Title</label>
      <input
        type="text"
        id="assignmentName"
        class="form-control"
        placeholder="Assignment title"
        [(ngModel)]="assignment.title"
        name="title"
        required
      />
    </div>

    <div class="mb-3">
      <label for="assignmentDeadline" class="form-label">Deadline</label>
      <input
        type="datetime-local"
        id="assignmentDeadline"
        class="form-control"
        [(ngModel)]="assignment.deadLine"
        name="deadline"
        required
      />
    </div>

    <div class="mb-3">
      <label for="assignmentStatus" class="form-label">Initial status</label>
      <select id="assignmentStatus" class="form-select" [(ngModel)]="assignment.status" name="status">
        <option [ngValue]="1">Published</option><option [ngValue]="0">Draft</option>
      </select>
    </div>

    <div class="mb-4">
      <label for="assignmentfile" class="form-label">
        File (pdf/doc/zip/code/images, max 10 MB)
      </label>
      <input
        type="file"
        id="assignmentfile"
        class="form-control"
        (change)="onFileSelected($event)"
        name="file"
        required
      />
    </div>

    <button type="submit" class="btn btn-accent">Create Assignment</button>
  </form>
</div>
